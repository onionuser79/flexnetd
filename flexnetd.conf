# /usr/local/etc/ax25/flexnetd.conf — flexnetd v1.0
#
# Recommended configuration. See README.md "Parameter reference" for
# every keyword. The file is read at start-up: restart flexnetd after
# editing it.

# ── Identity ──────────────────────────────────────────────────────────
# MinSSID/MaxSSID: SSID range of MyCall's base callsign advertised as
# one destination. Set both to your node's SSID unless you own the range.
MyCall          NODEA-3
Alias           NODEA
MinSSID         3
MaxSSID         3

# ── Mode ──────────────────────────────────────────────────────────────
#   server = native FlexNet peering (recommended; needs Port lines)
#   client = legacy D-command polling, no peering
Role            server

# ── FlexNet ports ─────────────────────────────────────────────────────
#
#   Port <axports_name> <neighbour_call> <listen_call>  [options]
#
# Up to 4 Port lines. They may share one listen_call. The
# [<listen_call> VIA <axports_name>] entry MUST NOT be in ax25d.conf.
#
# Options (omit to use the global default):
#   route_advert=<s>   0 = own routes at session start only; N = also every N s
#   lt_reply=<s>       minimum interval between link-time frames; 0 = reply to
#                      every keepalive / link-time frame from the neighbour
#   advert_mode=       full   = '3+', own records, '3-'
#                      record = own records only
#
# Required values per neighbour type:
#   (X)Net      route_advert=0  lt_reply=0    advert_mode=full
#               (longer lt_reply leaves (X)Net's link measurement stuck)
#   PC/Flexnet  route_advert=0  lt_reply=320  advert_mode=record
#               (PC/Flexnet drops the link on an unexpected '3+' or on
#                records pushed after its table exchange, and records a
#                saturated cost if link-time frames come faster than 320 s)

Port xnet  NODEB-14  NODEA-3  route_advert=0  lt_reply=0    advert_mode=full
# Port pcf   NODEC-12  NODEA-3  route_advert=0  lt_reply=320  advert_mode=record

# ── Timers ────────────────────────────────────────────────────────────
PollInterval          240   # client mode only: seconds between D polls
PathProbeInterval       0   # seconds between background path queries; 0 = off
RouteAdvertInterval     0   # global default for route_advert
LinkTimeReplyInterval 320   # global default for lt_reply (PC/Flexnet-safe)

# ── Output files (read by URONode and flexdest) ──────────────────────
GatewaysFile    /usr/local/var/lib/ax25/flex/gateways
DestFile        /usr/local/var/lib/ax25/flex/destinations
LinkStatsFile   /usr/local/var/lib/ax25/flex/linkstats
PathsFile       /usr/local/var/lib/ax25/flex/paths

# ── Protocol ──────────────────────────────────────────────────────────
Infinity        60000       # unreachable cost; do not change

# ── Logging ───────────────────────────────────────────────────────────
LogLevel        3           # 1=error 2=warn 3=info 4=debug
Syslog          yes
